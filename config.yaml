# LCP Server Configuration
# Auto-generated by setup script - DO NOT edit this template directly
# Based on config-example.yaml from lcp-server repository

log_level: "info"
public_base_url: "http://localhost:8989"
port: 8989

# Database connection string
# Format: driver://username:password@tcp(host:port)/database
dsn: "mysql://chapters_user:user_password@tcp(mysql:3306)/lcp_db"

# Basic access configuration for LCP API
access:
  username: "lcp_api_user"
  password: "lcp_api_password"

# Provider cert + key (generate locally when EDRLab test PEMs expire; see lcp-server README)
certificate:
  cert: "/config/cert-edrlab-test.pem"
  private_key: "/config/privkey-edrlab-test.pem"

# License configuration
license:
  provider: "http://localhost:8989"
  profile: "http://readium.org/lcp/basic-profile"
  hint_link: "http://localhost:4321/help"

# License status configuration
status:
  fresh_license_link: "http://localhost:8989/license"
  allow_renew_on_expired_licenses: true
  renew_default_days: 14
  renew_max_days: 90
  renew_link: "http://localhost:8989/renew"

# Dashboard configuration
dashboard:
  excessive_sharing_threshold: 5
  limit_to_last_12_months: true

# JWT configuration and administrator accounts
jwt:
  # Secret key for signing JWT tokens (CHANGE THIS IN PRODUCTION!)
  secret_key: "your-super-secret-jwt-key-for-chapters-ebook-platform-change-in-production"
  
  # Administrator accounts for dashboard access
  # Format: username: password
  admin:
    admin: "supersecret"
    operator: "operator123"

# Resources directory (not used in testing)
resources: "/resources"
